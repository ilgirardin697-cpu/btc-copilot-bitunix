name: V8 SHADOW checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  v8:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install numpy requests
      - name: Check V8 syntax
        run: python -m py_compile trend_v8.py test_trend_v8.py
      - name: Test V8 without network or credentials
        run: python -m unittest discover -v
      - name: Check patch whitespace
        run: git diff --check HEAD^ HEAD
