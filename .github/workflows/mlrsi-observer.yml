name: Passive ML RSI MTF observer
on: [push, pull_request]
permissions:
  contents: read
jobs:
  mlrsi_observer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install explicit runtime and test dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile observer and integration
        run: python -m py_compile mlrsi_math.py mlrsi_pine_reference.py mlrsi_public.py mlrsi_observer.py mlrsi_telegram.py mlrsi_guardian_host.py mlrsi_safety_audit.py trade_guardian.py guardian_commands.py test_mlrsi_observer.py test_mlrsi_integration.py test_mlrsi_pine_parity.py test_mlrsi_source_parity.py test_mlrsi_recovery.py
      - name: Dedicated offline math, state and Guardian isolation tests
        run: python -m unittest test_mlrsi_observer test_mlrsi_integration test_mlrsi_pine_parity test_mlrsi_source_parity test_mlrsi_recovery -v
      - name: Guardian protection and owner-only command regression
        run: python -m unittest test_trade_guardian test_guardian_commands -v
      - name: Verify unchanged Guardian AST and V8 baseline hashes
        run: python mlrsi_safety_audit.py
      - name: Full repository regression
        run: python -m unittest discover -v
      - name: Patch whitespace
        run: git diff --check HEAD^ HEAD
