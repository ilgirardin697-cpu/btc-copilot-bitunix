name: Guardian capital protection V2
on: [push, pull_request]
permissions:
  contents: read
jobs:
  capital:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt tzdata
      - run: python -m compileall -q guardian_capital_v2 capital_v2_safety.py trade_guardian.py
      - name: Protection policy, exchange faults, restarts and manual additions
        run: python -m unittest test_guardian_capital_v2 test_guardian_capital_v2_runtime -v
      - name: Preserve previous protections and frozen protocols
        run: |
          python mlrsi_safety_audit.py
          python test_bitman_weekly_boundary.py --require-v8 -v
          python test_bitman_readiness_boundary.py --require-v8 -v
      - name: All existing commands, 900 readiness cases and full regression
        run: python -m unittest discover -v
      - run: git diff --check HEAD^ HEAD
