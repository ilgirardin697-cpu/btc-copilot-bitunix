name: Killzone PRICE independent observer
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline-observer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Existing dependencies plus observer timezone database
        run: python -m pip install -r requirements.txt -r igod_killzone_price_observer/requirements.txt
      - name: Mandatory dependencies and compilation
        run: |
          python -c "import numpy; from zoneinfo import ZoneInfo; ZoneInfo('America/New_York')"
          python -m compileall -q igod_killzone_price_observer test_killzone_price_observer.py
      - name: Frozen PRICE parity, real-time capture, durability and recovery fixtures
        run: python -m unittest test_killzone_price_observer -v
      - name: Preserve Guardian, ML RSI, V8, weekly protocol and readiness
        run: |
          python mlrsi_safety_audit.py
          python test_bitman_weekly_boundary.py --require-v8 -v
          python test_bitman_readiness_boundary.py --require-v8 -v
      - name: Full regression with dependencies
        run: python -m unittest discover -v
      - name: Patch whitespace
        run: git diff --check HEAD^ HEAD
