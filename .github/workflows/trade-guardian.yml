name: I-GOD Trade Guardian audit
on: [push, pull_request]
permissions:
  contents: read
jobs:
  guardian:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install explicit runtime and test dependencies
        run: python -m pip install numpy requests
      - name: Compile Guardian modules
        run: python -m py_compile guardian_risk.py guardian_signals.py guardian_bitunix.py guardian_market.py guardian_store.py guardian_telegram.py guardian_commands.py copilot_audit.py koncorde_shadow.py trade_guardian.py test_trade_guardian.py test_guardian_commands.py test_guardian_ux.py test_hierarchical_levels.py test_copilot_forward_audit.py test_live_levels_canary.py
      - name: Run offline Guardian safety suite
        run: python -m unittest test_trade_guardian test_guardian_commands test_guardian_ux test_hierarchical_levels test_copilot_forward_audit test_live_levels_canary -v
      - name: Run repository suite
        run: python -m unittest discover -v
      - name: Check patch whitespace
        run: git diff --check HEAD^ HEAD
