name: Bitman visual forward research
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline_visual_protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Compile offline contracts
        run: python -m compileall -q research/bitman_visual_forward test_bitman_visual_forward.py
      - name: Synthetic comparator, pinned PR33 parity, causal clocks and integrity
        run: python -m unittest test_bitman_visual_forward -v
      - name: Original safety audits
        run: python mlrsi_safety_audit.py
      - run: python test_bitman_weekly_boundary.py --require-v8 -q
      - run: python test_bitman_readiness_boundary.py --require-v8 -q
      - name: All 900 approved operability combinations
        run: python -m unittest test_bitman_readiness -q
      - name: Entire offline regression suite
        run: python -m unittest discover -v
      - run: git diff --check origin/mlrsi-mtf-observer...HEAD
