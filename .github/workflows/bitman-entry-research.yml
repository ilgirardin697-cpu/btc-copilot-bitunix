name: Bitman intraday entry research
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline_entry_lab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Compile isolated offline laboratory
        run: python -m compileall -q research/bitman_entry_lab test_bitman_entry_lab.py
      - name: Causal fixtures, parity, isolation, lock and historical artifact audit
        run: python -m unittest test_bitman_entry_lab -v
      - name: Preserve readiness, weekly V1 and V8
        run: python -m unittest test_bitman_readiness test_bitman_weekly_forward -q
      - run: python test_bitman_weekly_boundary.py --require-v8 -q
      - run: python test_bitman_readiness_boundary.py --require-v8 -q
      - run: python mlrsi_safety_audit.py
      - name: Entire offline regression suite
        run: python -m unittest discover -q
      - run: git diff --check origin/mlrsi-mtf-observer...HEAD
