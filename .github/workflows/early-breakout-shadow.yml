name: Early Breakout public SHADOW research
on: [push, pull_request]
permissions:
  contents: read
jobs:
  early_breakout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install explicit dependencies
        run: python -m pip install numpy requests
      - name: Compile standalone observer and research
        run: python -m py_compile early_breakout_core.py early_breakout_shadow.py research/early_breakout_data.py research/early_breakout_reference.py research/early_breakout_research.py test_early_breakout.py
      - name: Run dedicated offline tests
        run: python -m unittest test_early_breakout -v
      - name: Run repository tests
        run: python -m unittest discover -v
      - name: Whitespace
        run: git diff --check HEAD^ HEAD
