name: Killzone PRICE frozen radar audit
on:
  push:
    paths:
      - 'research/killzone_price_radar/**'
      - '.github/workflows/killzone-price-radar.yml'
  pull_request:
    paths:
      - 'research/killzone_price_radar/**'
      - '.github/workflows/killzone-price-radar.yml'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy requests tzdata
      - run: python -m compileall -q research/killzone_price_radar
      - name: Frozen PRICE, untouched PR41/42, causal prefixes, prospective integrity and publication gate
        run: python -m unittest research.killzone_price_radar.test_price -v
      - run: git diff --check HEAD^ HEAD
