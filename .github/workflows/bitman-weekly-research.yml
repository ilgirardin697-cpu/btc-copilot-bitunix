name: Bitman weekly expansion research
on: [push, pull_request]
permissions:
  contents: read
jobs:
  weekly_research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing dependencies
        run: python -m pip install -r requirements.txt
      - name: Offline formulas, causality, research and production isolation
        run: python -m unittest test_bitman_weekly_expansion test_bitman_weekly_boundary test_bitman_readiness test_bitman_readiness_boundary -v
      - name: Existing protection and V8 audit
        run: python mlrsi_safety_audit.py
      - name: Patch whitespace
        run: git diff --check HEAD^ HEAD
