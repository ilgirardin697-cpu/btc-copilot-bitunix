name: I-GOD daily plan and single-bot router
on: [push, pull_request]
permissions:
  contents: read
jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Existing dependencies and timezone database
        run: python -m pip install -r requirements.txt tzdata
      - name: Compile
        run: python -m compileall -q igod_daily_plan daily_plan_guardian.py daily_plan_safety.py guardian_commands.py
      - name: Daily core, phases, schedule, dedupe, routing and isolation
        run: python -m unittest test_igod_daily_plan test_igod_daily_integration -v
      - name: Frozen protection, indicators, V8, weekly protocol and original command policy
        run: |
          python mlrsi_safety_audit.py
          python test_bitman_weekly_boundary.py --require-v8 -v
          python test_bitman_readiness_boundary.py --require-v8 -v
      - name: Full regression including all 900 original operability cases
        run: python -m unittest discover -v
      - name: Whitespace
        run: git diff --check HEAD^ HEAD
