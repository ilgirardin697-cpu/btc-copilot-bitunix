name: Bitman Market Data
on: [push, pull_request]
permissions:
  contents: read
jobs:
  private_market_data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile gateway and consumer
        run: python -m compileall -q bitman_market_data_service.py bitman_manual test_bitman_market_data.py
      - name: Private transport equivalence and manual command safety
        run: python -m unittest test_bitman_market_data test_bitman_manual test_guardian_commands test_live_levels_canary -v
      - name: Guardian, ML RSI and V8 protected-source audit
        run: python mlrsi_safety_audit.py
      - name: Patch whitespace
        run: git diff --check HEAD^ HEAD
