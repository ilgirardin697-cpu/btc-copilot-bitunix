name: I-GOD silent notification radar
on: [push, pull_request]
permissions:
  contents: read
jobs:
  notifications:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt tzdata
      - run: python -m compileall -q igod_notifications notification_safety.py
      - run: python -m unittest test_notification_radar -v
      - run: python mlrsi_safety_audit.py
      - run: python test_bitman_weekly_boundary.py --require-v8 -v
      - run: python test_bitman_readiness_boundary.py --require-v8 -v
      - run: python -m unittest discover -v
      - run: git diff --check HEAD^ HEAD
