name: Kill Zones single-segment visual V1
on:
  push:
    paths:
      - 'research/kill_zones_visual_v1/**'
      - '.github/workflows/kill-zones-visual-v1.yml'
  pull_request:
    paths:
      - 'research/kill_zones_visual_v1/**'
      - '.github/workflows/kill-zones-visual-v1.yml'
permissions:
  contents: read
jobs:
  offline-geometry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install tzdata==2026.6
      - run: python -m compileall -q research/kill_zones_visual_v1
      - run: python -m unittest research.kill_zones_visual_v1.test_prototype research.kill_zones_visual_v1.test_coherence -v
      - name: Regenerate only visual checks and verify determinism
        run: |
          python -m research.kill_zones_visual_v1.build_visuals
          git diff --exit-code -- research/kill_zones_visual_v1/examples
      - run: git diff --check HEAD^ HEAD
